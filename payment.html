<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .payment-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #218838; }
        #status-msg { margin-top: 15px; font-weight: bold; }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // आपकी Firebase कॉन्फ़िगरेशन
        const firebaseConfig = {
            apiKey: "AIzaSyBjG-uwtWfr3sFUxLhjs2e7fkbryAo1ysU",
            authDomain: "mahalakshmi-91935.firebaseapp.com",
            databaseURL: "https://mahalakshmi-91935-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mahalakshmi-91935",
            storageBucket: "mahalakshmi-91935.firebasestorage.app",
            messagingSenderId: "665618845136",
            appId: "1:665618845136:web:f87b797e5a2a810db7fdd5",
            measurementId: "G-P2FRX7C8DK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // पेमेंट बटन क्लिक इवेंट
        document.getElementById('pay-btn').addEventListener('click', async () => {
            const amount = document.getElementById('amount').value;
            const statusMsg = document.getElementById('status-msg');

            if (!amount || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            statusMsg.style.color = "blue";
            statusMsg.innerText = "Processing... Please wait.";
            document.getElementById('pay-btn').disabled = true;

            const txnid = "TXN" + new Date().getTime(); 
            const merchantKey = "BuIISI"; // यहाँ अपनी असली PayU Key (टोकन) डालें
            const productinfo = "Wallet Deposit";
            const firstname = "User"; 
            const email = "user@example.com";
            const phone = "9999999999";
            
            // GitHub Pages के लिंक्स (यहाँ अपना यूजरनेम और रिपॉजिटरी नाम बदलें)
            const surl = "https://savi777.online/payment.html?status=success";
            const furl = "https://savi777.online/payment.htmll?status=failed";

            try {
                // 1. Firestore डेटाबेस में पेंडिंग ट्रांज़ैक्शन सेव करें
                await setDoc(doc(db, "transactions", txnid), {
                    amount: amount,
                    status: "pending",
                    txnid: txnid,
                    createdAt: new Date()
                });

                // 2. Cloud Function से Hash प्राप्त करें
                const functionURL = "https://us-central1-mahalakshmi-91935.cloudfunctions.net/generatePayUHash";
                
                const response = await fetch(functionURL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ txnid, amount, productinfo, firstname, email })
                });
                
                const data = await response.json();
                
                if (!data.hash) {
                    throw new Error("Hash generation failed!");
                }

                // 3. PayU पेमेंट गेटवे पर फॉर्म सबमिट करें
                const form = document.createElement("form");
                form.method = "POST";
                form.action = "https://secure.payu.in/_payment"; 

                const params = {
                    key: merchantKey,
                    txnid: txnid,
                    amount: amount,
                    productinfo: productinfo,
                    firstname: firstname,
                    email: email,
                    phone: phone,
                    surl: surl,
                    furl: furl,
                    hash: data.hash
                };

                for (const key in params) {
                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = params[key];
                    form.appendChild(input);
                }

                document.body.appendChild(form);
                form.submit(); 

            } catch (error) {
                console.error(error);
                statusMsg.style.color = "red";
                statusMsg.innerText = "Error occurred. Try again.";
                document.getElementById('pay-btn').disabled = false;
            }
        });

        // पेमेंट के बाद स्टेटस दिखाना
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const statusMsg = document.getElementById('status-msg');
            
            if (status === 'success') {
                statusMsg.style.color = "green";
                statusMsg.innerText = "Payment Successful!";
            } else if (status === 'failed') {
                statusMsg.style.color = "red";
                statusMsg.innerText = "Payment Failed!";
            }
        };
    </script>
</head>
<body>

    <div class="payment-box">
        <h2>Add Deposit</h2>
        <input type="number" id="amount" placeholder="Enter Amount (₹)" required>
        <button id="pay-btn">Pay Now</button>
        <div id="status-msg"></div>
    </div>

</body>
</html>
