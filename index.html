<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure UPI Payment</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .payment-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 5px; }
        .merchant-name { color: #0070f3; font-weight: 600; margin-bottom: 25px; }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #0070f3;
            outline: none;
        }
        .pay-btn {
            width: 100%;
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pay-btn:hover { background-color: #0051b3; }
        .instructions {
            margin-top: 20px;
            background-color: #fff9db;
            border: 1px solid #ffe3e3;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #b05700;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>Make a Payment</h2>
    <div class="merchant-name">To: Ganesh Siddharth Patil</div>

    <div class="input-group">
        <label for="amount">Enter Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" min="1" step="any" required>
    </div>

    <button class="pay-btn" onclick="startPayment()">Proceed to Pay</button>
    
    <div class="instructions">
        <strong>💡 Note:</strong> Due to UPI security updates, after choosing your UPI app, please manually enter the same amount inside the app to complete the payment.
    </div>
</div>

<script>
    function startPayment() {
        const amount = document.getElementById('amount').value;
        if (!amount || amount <= 0) {
            alert('Please enter a valid amount.');
            return;
        }

        // Your exact verified details
        const upiId = "s0078204513092824@slc"; 
        const merchantName = "Ganesh Siddharth Patil"; 
        const mccCode = "5968"; 

        // Creating a dynamic payment note text (e.g., "Pay ₹500")
        const paymentNote = "Pay ₹" + amount;

        // The secure standard layout without the locked &am parameter
        const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(merchantName)}&mc=${mccCode}&tn=${encodeURIComponent(paymentNote)}&cu=INR`;

        // Launch the system's UPI picker tray
        window.location.href = upiUrl;
    }
</script>

</body>
</html>
