<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>savi777 - Ultimate PC Components Superstore</title>
    <style>
        :root {
            --primary: #00ffcc;
            --bg-dark: #07090e;
            --card-bg: #111827;
            --text-light: #f3f4f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); overflow-x: hidden; }
        
        header { background: linear-gradient(90deg, #030712, #111827); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        header h1 { color: var(--primary); font-size: 26px; text-transform: uppercase; letter-spacing: 2px; }
        .cart-info { background: var(--primary); color: #000; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        .hero { text-align: center; padding: 50px 20px; background: radial-gradient(circle, #1f2937 0%, #07090e 100%); border-bottom: 1px solid #1f2937; }
        .hero h2 { font-size: 38px; margin-bottom: 10px; color: var(--text-light); }
        .hero p { font-size: 16px; color: #9ca3af; max-width: 700px; margin: auto; }

        .container { max-width: 1450px; margin: auto; padding: 30px 20px; }
        .category-title { font-size: 24px; margin: 40px 0 20px 0; color: var(--primary); border-left: 5px solid var(--primary); padding-left: 12px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 20px; text-align: center; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #1f2937; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0, 255, 204, 0.15); border-color: var(--primary); }
        
        .card h3 { font-size: 17px; margin-bottom: 15px; height: 50px; overflow: hidden; color: #e5e7eb; display: flex; align-items: center; justify-content: center; }
        .price { font-size: 20px; color: var(--primary); font-weight: bold; margin-bottom: 15px; }
        
        .buy-btn { background: var(--primary); color: #000; border: none; padding: 10px 15px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: background 0.2s; width: 100%; }
        .buy-btn:hover { background: #00ccb1; }

        footer { text-align: center; padding: 40px; background: #030712; margin-top: 60px; border-top: 1px solid #1f2937; color: #4b5563; font-size: 14px; }
    </style>
</head>
<body>

    </header>

    <div class="hero">

        <p>Browse through hundreds of high-performance components. Clean text-based catalog for lightning-fast browsing!</p>
    </div>

    <footer>
        <p>&copy; 2026 savi777. All rights reserved. Powered by GitHub Pages.</p>
    </footer>

        ];

        const container = document.getElementById('store-container');

        storeCatalog.forEach((cat) => {
            let catTitle = document.createElement('h2');
            catTitle.className = 'category-title';
            catTitle.innerText = cat.category;
            container.appendChild(catTitle);

            let grid = document.createElement('div');
            grid.className = 'grid';

            cat.items.forEach((item) => {
                let price = Math.floor(Math.random() * (175000 - 1500 + 1)) + 1500;
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item}</h3>
                    <div class="price">₹${price.toLocaleString('en-IN')}</div>
                    <button class="buy-btn" onclick="buyItem('${item.replace(/'/g, "")}', ${price})">Buy Now</button>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        });

        function buyItem(name, price) {
            localStorage.setItem('selectedItem', name);
            localStorage.setItem('selectedPrice', price);
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
