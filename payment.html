<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalakshmi - Add Balance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #eff6ff 0%, #fdfbf7 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; border-radius: 24px; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="w-full max-w-[340px] bg-white border border-blue-100 rounded-3xl p-6 shadow-xl flex flex-col items-center space-y-4">
        <div class="flex flex-col items-center text-center">
            <div class="p-2.5 bg-blue-50 rounded-full w-16 h-16 flex items-center justify-center shadow-inner mb-2">
                <img src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-xl font-black bg-gradient-to-r from-blue-600 to-indigo-700 bg-clip-text text-transparent tracking-widest uppercase">MAHALAKSHMI</h1>
        </div>

        <div class="w-full space-y-3">
            <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 px-1">Enter Deposit Amount (₹)</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-base font-black text-blue-600">₹</span>
                <input type="number" id="amount" placeholder="100" class="w-full bg-blue-50/30 border border-gray-200 rounded-xl py-3 pl-8 pr-3 text-base font-black text-gray-800 focus:outline-none focus:border-blue-600 shadow-inner">
            </div>
            <button onclick="initiatePayment()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-black py-3.5 rounded-xl text-xs uppercase shadow-md active:scale-[0.99] transition-transform">⚡ Pay Now</button>
            <div id="status-text" class="text-center text-[11px] font-bold text-blue-600 h-6"></div>
        </div>
    </div>
</div>

<script>
    async function initiatePayment() {
        const amount = document.getElementById('amount').value;
        const urlParams = new URLSearchParams(window.location.search);
        const userid = urlParams.get('userid') || localStorage.getItem('app_user_mobile');
        
        if (!amount || amount < 1) return alert("Enter valid amount");
        
        const txnid = "TXN" + Date.now();
        document.getElementById('status-text').innerText = "Initiating...";

        // 1. Backend Call
        const response = await fetch("https://generatepayuhash-u7nrsrlm5q-uc.a.run.app", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ txnid, amount, productinfo: "Wallet", firstname: "User", email: "no-reply@mahalakshmi.com", userid: userid })
        });
        const { hash } = await response.json();

        // 2. Payment Form
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "https://secure.payu.in/_payment";

        const fields = {
            key: "BuIISI",
            txnid, amount, productinfo: "Wallet", firstname: "User", email: "no-reply@mahalakshmi.com",
            hash: hash,
            surl: "https://payuwebhook-u7nrsrlm5q-uc.a.run.app",
            furl: "https://payuwebhook-u7nrsrlm5q-uc.a.run.app",
            udf1: userid,
            payment_mode: "UPI",
            enforce_payment_mode: "UPI",
            upi_intent: "true"
        };

        for (const key in fields) {
            const input = document.createElement("input");
            input.type = "hidden"; input.name = key; input.value = fields[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        form.submit();
    }
</script>
</body>
</html>
