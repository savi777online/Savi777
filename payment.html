<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalakshmi - Add Balance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #fdfbf7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            border-radius: 24px;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjG-uwtWfr3sFUxLhjs2e7fkbryAo1ysU",
            authDomain: "mahalakshmi-91935.firebaseapp.com",
            databaseURL: "https://mahalakshmi-91935-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mahalakshmi-91935",
            storageBucket: "mahalakshmi-91935.firebasestorage.app",
            messagingSenderId: "665618845136",
            appId: "1:665618845136:web:f87b797e5a2a810db7fdd5",
            measurementId: "G-P2FRX7C8DK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const userid = urlParams.get('userid') || localStorage.getItem('app_user_mobile') || "UNKNOWN_USER";

        let isCheckingPayment = false;

        // 🔄 Core Verification Function (ऑटोमैटिक बैलेंस जोड़ने वाला कोड)
        async function checkAndProcessPayment(isAutoCheck = false) {
            const txnid = localStorage.getItem('pending_txnid');
            const amount = localStorage.getItem('pending_amount');
            const statusText = document.getElementById('status-text');

            if (!txnid || !amount || isCheckingPayment) return;
            isCheckingPayment = true;

            if (!isAutoCheck) {
                statusText.style.color = "blue";
                statusText.innerText = "Checking payment status...";
            }

            try {
                const txRef = doc(db, "transactions", txnid);
                const txSnap = await getDoc(txRef);

                if (txSnap.exists()) {
                    const txData = txSnap.data();

                    // अगर पहले से प्रोसेस हो चुका है
                    if (txData.processed === true) {
                        localStorage.removeItem('pending_txnid');
                        localStorage.removeItem('pending_amount');
                        window.location.replace("dashboard.html");
                        return;
                    }

                    // ⚡ यहाँ हम मान लेते हैं कि यूजर ने पेमेंट कर दी है, अब हम डेटाबेस अपडेट करेंगे
                    // (Note: Direct UPI में gateway से automatic success webhook नहीं आता, 
                    // इसलिए जैसे ही यूजर लौटता है, हम ट्रांजैक्शन को success मानकर बैलेंस जोड़ देते हैं)
                    await setDoc(txRef, { 
                        status: "success", 
                        processed: true, 
                        updatedAt: new Date() 
                    }, { merge: true });

                    const userRef = doc(db, "users", userid);
                    await updateDoc(userRef, {
                        walletBalance: increment(Number(amount))
                    });

                    // LocalStorage साफ करें
                    localStorage.removeItem('pending_txnid');
                    localStorage.removeItem('pending_amount');

                    statusText.style.color = "green";
                    statusText.innerText = "Payment Successful! Balance Added.";
                    
                    setTimeout(() => {
                        window.location.replace("https://savi777online.github.io/savi/dashboard.html");
                    }, 1200);

                } else {
                    isCheckingPayment = false;
                }
            } catch (e) {
                console.error(e);
                isCheckingPayment = false;
            }
        }

        // 🚀 1. जब यूजर पेमेंट ऐप से वापस इस WebView पर लौटेगा (Auto-detect Return)
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible") {
                // यूजर ऐप पर वापस आ गया है, तुरंत ऑटोमैटिक चेक चलाओ
                checkAndProcessPayment(true);
            }
        });

        window.addEventListener("focus", function() {
            checkAndProcessPayment(true);
        });

        // पेज लोड होने पर भी चेक करें
        window.onload = function() {
            const savedTxnId = localStorage.getItem('pending_txnid');
            if (savedTxnId) {
                document.getElementById('status-text').style.color = "blue";
                document.getElementById('status-text').innerText = "Waiting for payment confirmation...";
            }
        };

        // 2. Pay Button Click Handler
        window.handleDirectUPI = async function() {
            const amountInput = document.getElementById('amount').value.trim();
            const statusText = document.getElementById('status-text');

            if (!amountInput || Number(amountInput) <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            const txnid = "TXN" + new Date().getTime() + "_" + Math.floor(Math.random() * 1000);
            const upiID = "savi777.payu@mairtel"; 
            const payeeName = "Mahalakshmi";
            const note = "Wallet Deposit";

            statusText.style.color = "blue";
            statusText.innerText = "Opening UPI App...";

            try {
                // डेटाबेस में pending ट्रांजैक्शन सेव करें
                await setDoc(doc(db, "transactions", txnid), {
                    amount: amountInput,
                    status: "pending",
                    processed: false,
                    txnid: txnid,
                    userid: userid,
                    createdAt: new Date()
                });

                // LocalStorage में सेव करें
                localStorage.setItem('pending_txnid', txnid);
                localStorage.setItem('pending_amount', amountInput);

                // UPI Intent URI
                const upiUri = `upi://pay?pa=${upiID}&pn=${encodeURIComponent(payeeName)}&am=${amountInput}&cu=INR&tn=${encodeURIComponent(note)}`;

                // फोन की UPI ऐप खोलें
                window.location.href = upiUri;

            } catch (e) {
                console.error(e);
                alert("Something went wrong. Please try again.");
            }
        };
    </script>
</head>
<body>

<div class="app-container">
    
    <div class="w-full max-w-[340px] bg-white border border-blue-100 rounded-3xl p-6 shadow-xl flex flex-col items-center space-y-4">
        
        <div class="flex flex-col items-center text-center">
            <div class="p-2.5 bg-blue-50 rounded-full w-16 h-16 flex items-center justify-center shadow-inner mb-2">
                <img src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-xl font-black bg-gradient-to-r from-blue-600 to-indigo-700 bg-clip-text text-transparent tracking-widest uppercase">MAHALAKSHMI</h1>
            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">Instant Wallet Deposit</p>
        </div>

        <div class="w-full space-y-3">
            <div>
                <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 px-1">Enter Deposit Amount (₹)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-base font-black text-blue-600">₹</span>
                    <input type="number" id="amount" inputmode="numeric" placeholder="100" class="w-full bg-blue-50/30 border border-gray-200 rounded-xl py-3 pl-8 pr-3 text-base font-black text-gray-800 focus:outline-none focus:border-blue-600 shadow-inner">
                </div>
            </div>

            <button onclick="handleDirectUPI()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-black py-3.5 rounded-xl tracking-wider text-xs uppercase shadow-md transition-all transform active:scale-[0.99] flex items-center justify-center space-x-2">
                <span>⚡ Pay via UPI App</span>
            </button>
            <div id="status-text" class="text-center text-[11px] font-bold text-blue-600 h-6"></div>
        </div>

    </div>

    <div class="absolute bottom-4 text-center w-full">
        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">© 2018 Mahalakshmi Secure Gateway</p>
    </div>

</div>

</body>
</html>
