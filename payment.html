<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalakshmi - Secure Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #fdfbf7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            border-radius: 24px;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjG-uwtWfr3sFUxLhjs2e7fkbryAo1ysU",
            authDomain: "mahalakshmi-91935.firebaseapp.com",
            databaseURL: "https://mahalakshmi-91935-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mahalakshmi-91935",
            storageBucket: "mahalakshmi-91935.firebasestorage.app",
            messagingSenderId: "665618845136",
            appId: "1:665618845136:web:f87b797e5a2a810db7fdd5",
            measurementId: "G-P2FRX7C8DK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const userid = urlParams.get('userid') || localStorage.getItem('app_user_mobile') || "UNKNOWN_USER";

        // Handle return status from PayU webhook/redirect
        window.onload = function() {
            const paymentStatus = urlParams.get('status');
            const statusText = document.getElementById('status-text');

            if (paymentStatus === 'success') {
                statusText.style.color = "green";
                statusText.innerText = "Payment Successful! Redirecting to Dashboard...";
                setTimeout(() => {
                    window.location.replace("dashboard.html");
                }, 1500);
            } else if (paymentStatus === 'failed') {
                statusText.style.color = "red";
                statusText.innerText = "Payment Failed or Cancelled. Try again.";
            }
        };

        window.handlePayUCheckout = async function() {
            const amountInput = document.getElementById('amount').value.trim();
            const btn = document.getElementById('pay-btn');
            const statusText = document.getElementById('status-text');

            if (!amountInput || Number(amountInput) <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Connecting to PayU...
            `;
            statusText.innerText = "Securely loading gateway...";

            const txnid = "TXN" + new Date().getTime() + "_" + Math.floor(Math.random() * 1000); 
            const merchantKey = "BuIISI"; 
            const productinfo = "Wallet Deposit";
            const firstname = "User"; 
            const email = "user@example.com";
            const phone = "9999999999";
            
            // Webhook and return URLs pointing to your Firebase Cloud Function
            const webhookUrl = "https://payuwebhook-u7nrsrlm5q-uc.a.run.app";

            try {
                // Save pending transaction in Firestore
                await setDoc(doc(db, "transactions", txnid), {
                    amount: amountInput,
                    status: "pending",
                    txnid: txnid,
                    userid: userid,
                    createdAt: new Date()
                });

                const functionURL = "https://generatepayuhash-u7nrsrlm5q-uc.a.run.app";
                
                const response = await fetch(functionURL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ txnid, amount: amountInput, productinfo, firstname, email, userid })
                });
                
                const data = await response.json();
                
                if (!data.hash) throw new Error("Hash generation failed!");

                // Create hidden form to submit securely to PayU
                const form = document.createElement("form");
                form.method = "POST";
                form.action = "https://secure.payu.in/_payment"; 

                const params = {
                    key: merchantKey,
                    txnid: txnid,
                    amount: amountInput,
                    productinfo: productinfo,
                    firstname: firstname,
                    email: email,
                    phone: phone,
                    surl: webhookUrl,
                    furl: webhookUrl,
                    hash: data.hash,
                    udf1: userid,  
                    pg: "UPI",         
                    bankcode: "UPI",
                    enforce_paymethod: "upi"
                };

                for (const key in params) {
                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = params[key];
                    form.appendChild(input);
                }

                document.body.appendChild(form);
                form.submit(); 

            } catch (error) {
                console.error(error);
                alert("Something went wrong. Please try again.");
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.innerHTML = "🚀 Pay Securely Now";
                statusText.innerText = "";
            }
        };
    </script>
</head>
<body>

<div class="app-container">
    
    <!-- SQUARE POP-UP CARD -->
    <div class="w-full max-w-[340px] bg-white border border-blue-100 rounded-3xl p-6 shadow-xl flex flex-col items-center space-y-4">
        
        <!-- LOGO & HEADER -->
        <div class="flex flex-col items-center text-center">
            <div class="p-2.5 bg-blue-50 rounded-full w-16 h-16 flex items-center justify-center shadow-inner mb-2">
                <img src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-xl font-black bg-gradient-to-r from-blue-600 to-indigo-700 bg-clip-text text-transparent tracking-widest uppercase">MAHALAKSHMI</h1>
            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">Instant Wallet Deposit</p>
        </div>

        <!-- INPUT & BUTTON CONTAINER -->
        <div class="w-full space-y-3">
            <div>
                <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 px-1">Enter Deposit Amount (₹)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-base font-black text-blue-600">₹</span>
                    <input type="number" id="amount" inputmode="numeric" placeholder="100" class="w-full bg-blue-50/30 border border-gray-200 rounded-xl py-3 pl-8 pr-3 text-base font-black text-gray-800 focus:outline-none focus:border-blue-600 shadow-inner">
                </div>
            </div>

            <button onclick="handlePayUCheckout()" id="pay-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-black py-3.5 rounded-xl tracking-wider text-xs uppercase shadow-md transition-all transform active:scale-[0.99]">
                🚀 Pay Securely Now
            </button>
            <div id="status-text" class="text-center text-[11px] font-bold text-blue-600 h-4"></div>
        </div>

    </div>

    <!-- FOOTER TRADEMARK -->
    <div class="absolute bottom-4 text-center w-full">
        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">© 2018 Mahalakshmi Secure Gateway</p>
    </div>

</div>

</body>
</html>
