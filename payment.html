<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Balance - Mahalakshmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #eff6ff 0%, #fdfbf7 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border-radius: 24px; padding: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="w-full max-w-[340px] text-center space-y-4">
            <h1 class="text-xl font-black text-blue-800 uppercase tracking-widest">MAHALAKSHMI</h1>
            <input type="number" id="amount" placeholder="Enter Amount (₹)" class="w-full p-4 border border-blue-200 rounded-xl text-center font-bold">
            <button onclick="initiatePayment()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">⚡ Pay Now</button>
            <p id="status-text" class="text-xs font-bold text-blue-600"></p>
        </div>
    </div>

    <script>
        async function initiatePayment() {
            const amount = document.getElementById('amount').value;
            if (!amount || amount < 1) return alert("Enter valid amount");
            
            // User ID fetch karna
            const urlParams = new URLSearchParams(window.location.search);
            const userid = urlParams.get('userid') || localStorage.getItem('app_user_mobile');
            
            const txnid = "TXN" + Date.now();
            document.getElementById('status-text').innerText = "Initiating...";
            
            // 1. Hash Generate (Backend Call)
            const response = await fetch("https://generatepayuhash-u7nrsrlm5q-uc.a.run.app", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    txnid, 
                    amount, 
                    productinfo: "Wallet", 
                    firstname: "User", 
                    email: "no-reply@mahalakshmi.com", 
                    userid: userid 
                })
            });
            const { hash } = await response.json();

            // 2. PayU UPI Intent Form
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "https://secure.payu.in/_payment";

            const fields = {
                key: "BuIISI",
                txnid,
                amount,
                productinfo: "Wallet",
                firstname: "User",
                email: "no-reply@mahalakshmi.com",
                hash: hash,
                surl: "https://payuwebhook-u7nrsrlm5q-uc.a.run.app",
                furl: "https://payuwebhook-u7nrsrlm5q-uc.a.run.app",
                udf1: userid, // Webhook ke liye ID pass karna
                payment_mode: "UPI",
                upi_intent: "true"
            };

            for (const key in fields) {
                const input = document.createElement("input");
                input.type = "hidden"; input.name = key; input.value = fields[key];
                form.appendChild(input);
            }
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
