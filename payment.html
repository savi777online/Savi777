<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Make Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .payment-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .amount-btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .amount-btn:hover {
      border-color: #333;
    }

    .amount-btn.selected {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .input-box {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      font-size: 18px;
      outline: none;
      margin-bottom: 20px;
    }

    .input-box:focus {
      border-color: #333;
    }

    .pay-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:hover {
      opacity: 0.9;
    }

    .selected-amount {
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
      color: #555;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      background: #ffe8e8;
      color: #c40000;
    }

    .info {
      background: #eeeeee;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="payment-card">

    <div class="logo">
      Payment
    </div>

    <div class="subtitle">
      Select or enter your payment amount
    </div>

    <div class="section-title">
      Select Amount
    </div>

    <div class="amount-grid">

      <button class="amount-btn" onclick="selectAmount(100, this)">
        ₹100
      </button>

      <button class="amount-btn" onclick="selectAmount(200, this)">
        ₹200
      </button>

      <button class="amount-btn" onclick="selectAmount(500, this)">
        ₹500
      </button>

      <button class="amount-btn" onclick="selectAmount(1000, this)">
        ₹1000
      </button>

    </div>

    <div class="section-title">
      Enter Amount
    </div>

    <input
      type="number"
      id="amountInput"
      class="input-box"
      placeholder="Enter amount"
      min="1"
      inputmode="numeric"
      oninput="clearSelection()"
    >

    <button class="pay-button" onclick="payNow()">
      Pay Now
    </button>

    <div id="selectedAmount" class="selected-amount">
      No amount selected
    </div>

    <div id="message" class="message"></div>

  </div>


  <script>

    let selectedAmount = 0;

    function selectAmount(amount, button) {

      selectedAmount = amount;

      document.getElementById("amountInput").value = amount;

      document.querySelectorAll(".amount-btn").forEach(function(btn) {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");

      document.getElementById("selectedAmount").innerText =
        "Selected Amount: ₹" + amount;

      hideMessage();
    }


    function clearSelection() {

      selectedAmount = 0;

      document.querySelectorAll(".amount-btn").forEach(function(btn) {
        btn.classList.remove("selected");
      });

      let value = document.getElementById("amountInput").value;

      if (value) {
        document.getElementById("selectedAmount").innerText =
          "Amount: ₹" + value;
      } else {
        document.getElementById("selectedAmount").innerText =
          "No amount selected";
      }

      hideMessage();
    }


    function payNow() {

      let amount =
        Number(document.getElementById("amountInput").value);

      if (!amount || amount <= 0) {

        showMessage(
          "Please select or enter a valid amount.",
          "error"
        );

        return;
      }

      /*
        Payment gateway integration will be added here.

        IMPORTANT:
        Do not put PayU Salt, Client Secret,
        or other private credentials in this file.
      */

      showMessage(
        "Amount selected: ₹" + amount +
        ". Payment processing will be connected here.",
        "info"
      );
    }


    function showMessage(text, type) {

      const message = document.getElementById("message");

      message.innerText = text;
      message.className = "message " + type;
      message.style.display = "block";
    }


    function hideMessage() {

      const message = document.getElementById("message");

      message.style.display = "none";
    }

  </script>

</body>
</html>
